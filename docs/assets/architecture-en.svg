<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">Equip Triage architecture</title>
<desc id="desc">Two independent paths: log replay and a research encoder.</desc>
<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#47617a"/></marker></defs>
<rect x="1" y="1" width="798" height="408" rx="18" fill="#fff" stroke="#d8e3ee"/>
<text x="32" y="35" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="16" fill="#17314e" font-weight="650" text-anchor="start">01  ·  OFFLINE REPLAY</text>
<rect x="32" y="50" width="205" height="62" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
<text x="134.5" y="75" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Equipment CSV</text>
<text x="134.5" y="97" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">Equipment / lot / sequence</text>
<rect x="279" y="50" width="235" height="62" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
<text x="396.5" y="75" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Normalize + audit</text>
<text x="396.5" y="97" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">UTC, gaps, duplicates, conflicts</text>
<rect x="556" y="50" width="212" height="62" rx="10" fill="#e7f2fe" stroke="#8eb9e6"/>
<text x="662.0" y="75" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Review evidence</text>
<text x="662.0" y="97" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">Review / hold + source rows</text>
<path d="M240 81 L273 81" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M517 81 L550 81" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M32 139H768" stroke="#d8e3ee"/>
<text x="32" y="172" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="16" fill="#17314e" font-weight="650" text-anchor="start">02  ·  SEQUENCE RESEARCH (SEPARATE FROM THE APP)</text>
<rect x="32" y="191" width="205" height="67" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
<text x="134.5" y="216" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Event IDs</text>
<text x="134.5" y="238" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">Token + position embeddings</text>
<rect x="279" y="191" width="235" height="67" rx="10" fill="#e7f2fe" stroke="#8eb9e6"/>
<text x="396.5" y="216" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Shared encoder ×2</text>
<text x="396.5" y="238" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">4-head QKV attention + MLP</text>
<rect x="556" y="184" width="212" height="60" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
<text x="662.0" y="209" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Masked-event head</text>
<text x="662.0" y="231" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">Predict a hidden event ID</text>
<rect x="556" y="262" width="212" height="60" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
<text x="662.0" y="287" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">Order head</text>
<text x="662.0" y="309" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">START state → 1 score</text>
<path d="M240 223 L273 223" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M515 224 H535 V214 H550" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M535 224 V292 H550" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<text x="32" y="292" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="start">Inside each block: QKV → scaled dot-product → softmax → V</text>
<text x="32" y="317" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="start">Attention and MLP each use residual + LayerNorm.</text>
<path d="M32 347H768" stroke="#d8e3ee"/>
<text x="32" y="377" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="16" fill="#17314e" font-weight="400" text-anchor="start">BERT-Tiny / BERT-Mini and SmolLM2 run only as external comparisons.</text>
</svg>
