<text x="396.5" y="97" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">UTC 변환 · 누락 · 중복 · 충돌</text>
<rect x="556" y="50" width="212" height="62" rx="10" fill="#e7f2fe" stroke="#8eb9e6"/>
<text x="662.0" y="75" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">검토 근거 표시</text>
<text x="662.0" y="97" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">점검 후보 / 보류 + 원본 행</text>
<path d="M240 81 L273 81" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M517 81 L550 81" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M32 139H768" stroke="#d8e3ee"/>
<text x="32" y="172" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="16" fill="#17314e" font-weight="650" text-anchor="start">02  ·  이벤트 순서 연구 (앱과 별도 실행)</text>
<rect x="32" y="191" width="205" height="67" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
<text x="134.5" y="216" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">이벤트 ID</text>
<text x="134.5" y="238" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">토큰 임베딩 + 위치 임베딩</text>
<rect x="279" y="191" width="235" height="67" rx="10" fill="#e7f2fe" stroke="#8eb9e6"/>
<text x="396.5" y="216" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="18" fill="#17314e" font-weight="650" text-anchor="middle">공유 인코더 블록 ×2</text>
<text x="396.5" y="238" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">4헤드 QKV 어텐션 + MLP</text>
<rect x="556" y="184" width="212" height="60" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
