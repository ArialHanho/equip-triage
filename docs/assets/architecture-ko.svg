<text x="134.5" y="97" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">장비 / LOT / 순번</text>
<rect x="279" y="50" width="235" height="62" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
