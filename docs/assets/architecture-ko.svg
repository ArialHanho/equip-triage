<text x="662.0" y="231" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">가린 이벤트 ID 복원</text>
<rect x="556" y="262" width="212" height="60" rx="10" fill="#f5f8fc" stroke="#c6d4e3"/>
