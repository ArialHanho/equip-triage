<text x="662.0" y="309" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="middle">START 표현 → 순서 점수 1개</text>
<path d="M240 223 L273 223" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M515 224 H535 V214 H550" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M535 224 V292 H550" fill="none" stroke="#47617a" stroke-width="2" marker-end="url(#arr)"/>
<text x="32" y="292" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="start">블록 내부: QKV → 스케일 내적 → softmax → V</text>
<text x="32" y="317" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="15" fill="#17314e" font-weight="400" text-anchor="start">어텐션과 MLP 각각에 잔차 연결과 LayerNorm 적용.</text>
<path d="M32 347H768" stroke="#d8e3ee"/>
<text x="32" y="377" font-family="system-ui, Noto Sans CJK KR, sans-serif" font-size="16" fill="#17314e" font-weight="400" text-anchor="start">BERT-Tiny / BERT-Mini 및 SmolLM2는 외부 비교 실험에만 사용.</text>
</svg>
