<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="814" viewBox="0 0 1040 814" role="img" aria-labelledby="title description">
<title id="title">How two check candidates read a bilingual memo</title>
<desc id="description">Original architecture diagram. Bind two memo lines to registered checks. A shared local encoder creates token states. Each candidate reads its matched tokens through four-head attention. Route only a single continuing issue with the other cleared; otherwise hold.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#56717e"/></marker></defs>
