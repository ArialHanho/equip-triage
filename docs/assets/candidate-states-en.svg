<text x="30" y="770" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">B = batch size · L = padded line length · E = candidate embedding · M broadcasts over the four heads.</text>
<text x="30" y="797" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="400">[1] Devlin et al. (2019)   [2] Wang et al. (2016)   [3] Liu et al. (2021). Sources in the study report.</text>
