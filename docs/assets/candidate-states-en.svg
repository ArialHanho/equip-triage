<rect x="333" y="338" width="307" height="156" rx="5" fill="#fbfcfd" stroke="#c4d0d6"/>
<rect x="690" y="338" width="309" height="156" rx="5" fill="#f1f7f5" stroke="#c4d0d6"/>
<text x="54" y="367" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">Clause-local BERT [1]</text>
<text x="54" y="394" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Shared weights · two blocks</text>
<text x="54" y="426" text-anchor="start" fill="#1d5982" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="600">H  [B, 2, L, 32]</text>
<text x="54" y="459" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Each line is encoded alone.</text>
<text x="347" y="367" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">Candidate queries [2, 3]</text>
<text x="347" y="396" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Q = Wq(domain + slot)</text>
<text x="347" y="424" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="500">Q       [B, 4, 2, 8]</text>
<text x="347" y="450" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="500">K, V   [B, 4, 2L, 8]  ← H</text>
<text x="347" y="477" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="400">Four heads · eight features per head</text>
<text x="704" y="367" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">Masked token pooling</text>
<text x="704" y="399" text-anchor="start" fill="#00665d" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="600">S = QKᵀ / √8</text>
<text x="704" y="428" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500">A = softmax(mask(S))</text>
<text x="704" y="454" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500">Z = Wₒ concat(A V)</text>
<text x="704" y="479" text-anchor="start" fill="#4e6573" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="15" font-weight="500">Z   [B, 2, 32]</text>
