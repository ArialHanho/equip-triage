<text x="31" y="72" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400">Masked candidate-query model  ·  Illustration using the expected states of a synthetic packet</text>
