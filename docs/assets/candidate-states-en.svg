<path d="M648 415 L679 415" stroke="#56717e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<text x="42" y="520" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">The mask excludes other lines, header tokens and padding. Ablations vary eligible lines and learned vs uniform weights.</text>
<path d="M30 540 L1010 540" stroke="#c4d0d6" stroke-width="1" fill="none"/>
<rect x="30" y="554" width="31" height="29" rx="3" fill="#152f42" stroke="#152f42"/>
<text x="45.5" y="575" text-anchor="middle" fill="white" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">C</text>
<text x="76" y="576" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="22" font-weight="650">Count continuing checks, then apply the validation cutoff</text>
<rect x="40" y="603" width="255" height="120" rx="5" fill="#f4f7f9" stroke="#c4d0d6"/>
<rect x="339" y="603" width="382" height="120" rx="5" fill="#fff" stroke="#c4d0d6"/>
<rect x="765" y="603" width="234" height="120" rx="5" fill="#fcf5ec" stroke="#c4d0d6"/>
<text x="54" y="630" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">Shared state head</text>
<text x="54" y="659" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500">LN(E + Z) → 3</text>
<text x="54" y="684" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">continues · cleared · unknown</text>
<text x="54" y="709" text-anchor="start" fill="#1d5982" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="15" font-weight="500">logits   [B, 2, 3]</text>
<text x="353" y="630" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">Expected decisions</text>
<text x="353" y="659" text-anchor="start" fill="#00665d" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">C1 continues + C2 cleared → C1</text>
<text x="353" y="687" text-anchor="start" fill="#974b19" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">Both continue → hold for review</text>
<text x="353" y="711" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="400">Unknown, zero active or invalid input → hold</text>
<text x="779" y="630" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">Confidence gate</text>
<text x="779" y="659" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Use the lower of the two</text>
<text x="779" y="682" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">state confidences.</text>
<text x="779" y="710" text-anchor="start" fill="#974b19" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">Below cutoff → hold</text>
