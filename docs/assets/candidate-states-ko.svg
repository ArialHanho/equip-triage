<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="814" viewBox="0 0 1040 814" role="img" aria-labelledby="title description">
<title id="title">두 점검 후보가 한·영 메모를 읽는 과정</title>
<desc id="description">직접 그린 구조도. 메모 두 줄을 등록된 점검에 연결하고, 공유 인코더가 줄마다 토큰 표현을 만듭니다. 각 후보는 네 개의 어텐션 헤드로 연결된 토큰을 읽습니다. 하나만 지속되고 다른 하나는 해소됐을 때 해당 점검으로 연결합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#56717e"/></marker></defs>
<rect width="1040" height="814" fill="#fff"/>
<text x="30" y="43" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="32" font-weight="700">두 점검 후보가 한·영 메모를 읽는 과정</text>
<text x="31" y="72" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400">후보별 마스크 어텐션 모델  ·  합성 기록의 정답 상태로 본 판정 원리</text>
<path d="M30 89 L1010 89" stroke="#c4d0d6" stroke-width="1" fill="none"/>
<rect x="30" y="103" width="31" height="29" rx="3" fill="#152f42" stroke="#152f42"/>
<text x="45.5" y="124" text-anchor="middle" fill="white" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">A</text>
<text x="76" y="125" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="22" font-weight="650">기록에 나타난 지칭 표현을 점검 순번에 연결</text>
<text x="40" y="161" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="600">등록된 점검 후보</text>
<text x="335" y="161" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="600">수신 순서대로 놓은 메모</text>
<rect x="40" y="174" width="238" height="35" rx="4" fill="#eaf5f1" stroke="none"/>
<rect x="40" y="174" width="4" height="35" rx="0" fill="#00665d" stroke="none"/>
<text x="54" y="197" text-anchor="start" fill="#00665d" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="700">C1</text>
<text x="102" y="197" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400">L7 · 데이터 수집</text>
<rect x="40" y="216" width="238" height="35" rx="4" fill="#eaf2f9" stroke="none"/>
<rect x="40" y="216" width="4" height="35" rx="0" fill="#1d5982" stroke="none"/>
<text x="54" y="239" text-anchor="start" fill="#1d5982" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="700">C2</text>
<text x="102" y="239" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400">P3 · 측정계</text>
<rect x="334" y="174" width="360" height="35" rx="4" fill="#eaf2f9" stroke="none"/>
<rect x="334" y="174" width="4" height="35" rx="0" fill="#1d5982" stroke="none"/>
<text x="348" y="197" text-anchor="start" fill="#1d5982" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="700">L1</text>
<text x="396" y="197" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400">P3 재검 결과 정상.</text>
<rect x="334" y="216" width="360" height="35" rx="4" fill="#eaf5f1" stroke="none"/>
<rect x="334" y="216" width="4" height="35" rx="0" fill="#00665d" stroke="none"/>
<text x="348" y="239" text-anchor="start" fill="#00665d" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="700">L2</text>
<text x="396" y="239" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400">L7 재검에서도 불량.</text>
<path d="M288 209 L319 209" stroke="#56717e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<path d="M704 209 L734 209" stroke="#56717e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<text x="749" y="157" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="600">후보가 읽을 수 있는 줄</text>
<text x="869" y="178" text-anchor="middle" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="600">L1</text>
<text x="937" y="178" text-anchor="middle" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="600">L2</text>
<text x="807" y="206" text-anchor="middle" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="650">C1</text>
<rect x="840" y="186" width="58" height="28" rx="3" fill="#f2f5f6" stroke="none"/>
<text x="869" y="206" text-anchor="middle" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">0</text>
<rect x="908" y="186" width="58" height="28" rx="3" fill="#00665d" stroke="none"/>
<text x="937" y="206" text-anchor="middle" fill="white" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">1</text>
<text x="807" y="240" text-anchor="middle" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="650">C2</text>
<rect x="840" y="220" width="58" height="28" rx="3" fill="#1d5982" stroke="none"/>
<text x="869" y="240" text-anchor="middle" fill="white" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">1</text>
<rect x="908" y="220" width="58" height="28" rx="3" fill="#f2f5f6" stroke="none"/>
<text x="937" y="240" text-anchor="middle" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">0</text>
<path d="M30 274 L1010 274" stroke="#c4d0d6" stroke-width="1" fill="none"/>
<rect x="30" y="288" width="31" height="29" rx="3" fill="#152f42" stroke="#152f42"/>
<text x="45.5" y="309" text-anchor="middle" fill="white" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">B</text>
<text x="76" y="310" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="22" font-weight="650">후보마다 연결된 근거를 읽어 상태를 계산</text>
<rect x="40" y="338" width="245" height="156" rx="5" fill="#f4f7f9" stroke="#c4d0d6"/>
<rect x="333" y="338" width="307" height="156" rx="5" fill="#fbfcfd" stroke="#c4d0d6"/>
<rect x="690" y="338" width="309" height="156" rx="5" fill="#f1f7f5" stroke="#c4d0d6"/>
<text x="54" y="367" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">줄별 BERT 인코더 [1]</text>
<text x="54" y="394" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">가중치 공유 · 블록 2개</text>
<text x="54" y="426" text-anchor="start" fill="#1d5982" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="600">H  [B, 2, L, 32]</text>
<text x="54" y="459" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">각 줄을 독립적으로 인코딩</text>
<text x="347" y="367" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">후보별 쿼리 [2, 3]</text>
<text x="347" y="396" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">Q ← 범주·순번 임베딩에서 투영</text>
<text x="347" y="424" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="500">Q       [B, 4, 2, 8]</text>
<text x="347" y="450" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="500">K, V   [B, 4, 2L, 8]  ← H</text>
<text x="347" y="477" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="400">헤드 4개 · 헤드당 8차원</text>
<text x="704" y="367" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">마스크를 적용한 토큰 가중합</text>
<text x="704" y="399" text-anchor="start" fill="#00665d" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="600">S = QKᵀ / √8</text>
<text x="704" y="428" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500">A = softmax(mask(S))</text>
<text x="704" y="454" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500">Z = Wₒ concat(A V)</text>
<text x="704" y="479" text-anchor="start" fill="#4e6573" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="15" font-weight="500">Z   [B, 2, 32]</text>
<path d="M292 415 L321 415" stroke="#56717e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<path d="M648 415 L679 415" stroke="#56717e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<text x="42" y="520" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">마스크는 다른 줄·헤더·패딩을 제외합니다. 대조 실험에서는 줄의 범위와 학습 가중치·균등 가중치를 바꿉니다.</text>
<path d="M30 540 L1010 540" stroke="#c4d0d6" stroke-width="1" fill="none"/>
<rect x="30" y="554" width="31" height="29" rx="3" fill="#152f42" stroke="#152f42"/>
<text x="45.5" y="575" text-anchor="middle" fill="white" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">C</text>
<text x="76" y="576" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="22" font-weight="650">지속 상태인 후보를 센 뒤 검증 임계값 적용</text>
<rect x="40" y="603" width="255" height="120" rx="5" fill="#f4f7f9" stroke="#c4d0d6"/>
<rect x="339" y="603" width="382" height="120" rx="5" fill="#fff" stroke="#c4d0d6"/>
<rect x="765" y="603" width="234" height="120" rx="5" fill="#fcf5ec" stroke="#c4d0d6"/>
<text x="54" y="630" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">공유 상태 분류기</text>
<text x="54" y="659" text-anchor="start" fill="#152f42" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500">LN(E + Z) → 3</text>
<text x="54" y="684" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">지속 · 해소 · 불명</text>
<text x="54" y="709" text-anchor="start" fill="#1d5982" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="15" font-weight="500">logits   [B, 2, 3]</text>
<text x="353" y="630" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">정답 상태를 넣은 결과</text>
<text x="353" y="659" text-anchor="start" fill="#00665d" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">C1 지속 + C2 해소 → C1 점검</text>
<text x="353" y="687" text-anchor="start" fill="#974b19" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">둘 다 지속 → 판정 보류</text>
<text x="353" y="711" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="400">하나라도 불명·둘 다 해소·기록 불완전 → 보류</text>
<text x="779" y="630" text-anchor="start" fill="#152f42" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="18" font-weight="650">신뢰도 기준</text>
<text x="779" y="659" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">두 후보 중 더 낮은</text>
<text x="779" y="682" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">상태 신뢰도를 사용</text>
<text x="779" y="710" text-anchor="start" fill="#974b19" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="650">임계값 미만 → 보류</text>
