<path d="M728 663 L754 663" stroke="#56717e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<path d="M30 746 L1010 746" stroke="#c4d0d6" stroke-width="1" fill="none"/>
<text x="30" y="770" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400">B = 배치 크기 · L = 패딩 후 줄 길이 · E = 후보 임베딩 · 마스크 M은 네 헤드에 공통으로 적용합니다.</text>
<text x="30" y="797" text-anchor="start" fill="#4e6573" font-family="Inter, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="14" font-weight="400">[1] Devlin 외 (2019)   [2] Wang 외 (2016)   [3] Liu 외 (2021). 원문 링크는 연구 문서에 있습니다.</text>
