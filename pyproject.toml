[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "equip-triage"
version = "0.1.0"
description = "A native PyTorch Transformer for candidate states in equipment memos"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3"]
license = {file = "LICENSE"}

[project.scripts]
equip-triage = "equip_triage.cli:main"

[tool.setuptools]
packages = ["equip_triage"]
